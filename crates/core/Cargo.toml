[package]
name = "trellis-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
imagesize = "0.13"
ureq = { version = "2", features = ["json"] }
rand = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
